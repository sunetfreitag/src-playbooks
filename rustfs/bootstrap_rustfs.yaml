---
- name: Install RustFS on SRC Virtual Machine
  become: true
  hosts: allhosts
  vars:
    src_user: "src-user"
  tasks:
    - name: Get regular user
      command: whoami
      register: regular_user

    - name: Print username
      ansible.builtin.debug:
        msg: "Username executing ansible: {{ regular_user.stdout }}"

    - name: Get hostname
      command: hostname
      register: raw_hostname
    - name: Save rustfs hostname in variable
      ansible.builtin.set_fact:
        rustfs_hostname: "{{ raw_hostname.stdout | replace('-','.') }}"

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install prerequisite packages
      ansible.builtin.package:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - acl
        state: present

    - name: Add Docker's official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: Update apt package index after adding Docker repo
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Docker Engine
      ansible.builtin.package:
        name: docker-ce
        state: latest

    - name: Start and enable Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure group "docker" exists with correct gid
      ansible.builtin.group:
        name: docker
        state: present
        gid: 1750

    - name: Set access permissions for docker socket
      ansible.builtin.file:
        path: /var/run/docker.sock
        mode: "0666"

    - name: Add the user 'src_user' with a bash shell, member of group 'docker'
      ansible.builtin.user:
        name: "{{ src_user }}"
        shell: /bin/bash
        groups: docker
        append: yes
        create_home: yes

    - name: Add the rustfs user to the docker group
      ansible.builtin.user:
        name: "{{ src_user }}"
        groups: docker
        append: yes

    - name: Create rustfs local script directory
      become: true
      ansible.builtin.file:
        path: /usr/local/{{ src_user }}-service/
        state: directory

    - name: Copy local docker compose file
      become: true
      ansible.builtin.copy:
        src: "./overlay/docker-compose.yml"
        dest: "/usr/local/{{ src_user }}-service/docker-compose.yml"

    - name: Create rustfs logging directory
      become: true
      ansible.builtin.file:
        path: /var/log/rustfs/
        owner: 10001
        group: 10001
        state: directory
        mode: "0700"

    - name: Create rustfs data directory
      become: true
      ansible.builtin.file:
        path: /data/
        owner: 10001
        group: 10001
        state: directory
        mode: "0700"

    - name: Create nginx app location directory
      become: true
      ansible.builtin.file:
        path: /etc/nginx/app-location-conf.d/
        state: directory

    - name: Copy rustfs nginx location block
      become: true
      ansible.builtin.copy:
        src: "./overlay/rustfs.conf"
        dest: /etc/nginx/app-location-conf.d/rustfs.conf
        mode: 0644

    - name: Copy rustfs service script
      ansible.builtin.copy:
        src: "./overlay/rustfs.service"
        dest: /etc/systemd/system/rustfs.service

    - name: Enable and start rustfs service
      systemd:
        name: rustfs
        state: started
        enabled: true

    - name: Restart nginx
      systemd:
        name: nginx
        state: restarted
        enabled: true

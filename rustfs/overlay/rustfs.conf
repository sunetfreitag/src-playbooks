# ---- RustFS Admin Console ----
location /rustfs/console/ {
    error_page 401 = @custom_401;
    auth_request /validate;
    auth_request_set $username $upstream_http_username;
    proxy_pass http://127.0.0.1:9001;
    proxy_redirect http://localhost:9001/rustfs/console/ $scheme://$host/rustfs/console/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Remoteuser $username;
    proxy_set_header Connection $connection_upgrade;
    client_max_body_size 10G;
}

# ---- RustFS API / Content ----
location / {
    auth_request off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Required to avoid connection issues with the S3 API [[5]]
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    chunked_transfer_encoding off;

    proxy_pass http://127.0.0.1:9000;
}

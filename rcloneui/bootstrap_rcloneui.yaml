---
- name: Install Rclone UI on SRC Virtual Machine
  become: true
  hosts: localhost
  # hosts: allhosts
  vars:
    rcloneui_user: "rclone"
    rcloneui_group: "rclone"
  tasks:
    # - name: Get s3 access key
    #   set_fact:
    #     s3_access_key_id: "{{ lookup('ansible.builtin.env', 's3_access_key_id') }}"
    # - name: Get s3 endpoint
    #   set_fact:
    #     s3_endpoint: " {{ lookup('ansible.builtin.env', 's3_endpoint') }}"
    # - name: Get s3 secret
    #   set_fact:
    #     s3_secret_access_key: "{{ lookup('ansible.builtin.env', 's3_secret_access_key') }}"

    # - name: Get nextcloud user
    #   set_fact:
    #     nextcloud_user: "{{ lookup('ansible.builtin.env', 'nextcloud_user') }}"
    # - name: Get nextcloud application password
    #   set_fact:
    #     nextcloud_pass: " {{ lookup('ansible.builtin.env', 'nextcloud_pass') }}"
    # - name: Get nextcloud url
    #   set_fact:
    #     nextcloud_url: "{{ lookup('ansible.builtin.env', 'nextcloud_url') }}"

    # # For some reason, there might be a whitespace at the beginning of the variable, which can mess up calling rclone config later
    # - name: Remove single white spaces
    #   set_fact:
    #     nextcloud_pass: "{{ nextcloud_pass | regex_replace(' ', '') }}"

    - name: Get regular user
      command: whoami
      register: regular_user

    - name: Print username
      ansible.builtin.debug:
        msg: "Username executing ansible: {{ regular_user.stdout }}"

    - name: Get hostname
      command: hostname
      register: raw_hostname

    - name: Save rcloneui hostname in variable
      ansible.builtin.set_fact:
        rcloneui_hostname: "{{ raw_hostname.stdout | replace('-','.') }}"

    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes

    - name: Install prerequisite packages
      ansible.builtin.package:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - acl
        state: present

    - name: Ensure that {{ rcloneui_group }} group exists
      ansible.builtin.group:
        name: "{{ rcloneui_group }}"
        state: present

    - name: Add user for {{ rcloneui_group }}
      ansible.builtin.user:
        name: "{{ rcloneui_user }}"
        shell: /bin/bash
        groups: "{{ rcloneui_user }}"
        home: /var/lib/{{ rcloneui_user }}

    - name: Create rclone user home directory
      ansible.builtin.file:
        path: /var/lib/{{ rcloneui_user }}
        state: directory
        owner: "{{ rcloneui_user }}"
        group: "{{ rcloneui_user }}"

    - name: Create rclone config in home directory
      ansible.builtin.file:
        path: /var/lib/{{ rcloneui_user }}/.config/rclone
        state: directory
        owner: "{{ rcloneui_user }}"
        group: "{{ rcloneui_user }}"

    - name: Create folder for {{ rcloneui_user }} service
      ansible.builtin.file:
        path: /usr/local/{{ rcloneui_user }}-service
        state: directory
        owner: "{{ rcloneui_user }}"
        group: "{{ rcloneui_user }}"

    - name: Copy start rclone agent script
      ansible.builtin.copy:
        src: "./overlay/start-agent.sh"
        dest: /usr/local/{{ rcloneui_user }}-service/start-agent.sh

    - name: Copy rcloneui service script
      ansible.builtin.copy:
        src: "./overlay/rcloneui.service"
        dest: /etc/systemd/system/rcloneui.service

    - name: Enable and start rcloneui service
      systemd:
        name: rcloneui
        state: started
        enabled: true

    - name: Create nginx app configuration directory
      ansible.builtin.file:
        path: /etc/nginx/app-location-conf.d/
        state: directory

    - name: Copy rcloneui nginx location block
      ansible.builtin.copy:
        src: "./overlay/rcloneui.conf"
        dest: /etc/nginx/app-location-conf.d/rcloneui.conf
        mode: 0644

    - name: Create rclone mount directory
      ansible.builtin.file:
        path: /mnt/rclone
        state: directory
        owner: "{{ rcloneui_user }}"
        group: "{{ rcloneui_user }}"

    - name: Create rclone s3 configuration
      become: true
      become_user: "{{ rcloneui_user }}"
      shell: rclone config create s3 s3 provider "Ceph" access_key_id "{{ s3_access_key_id }}" secret_access_key "{{ s3_secret_access_key }}" endpoint "{{ s3_endpoint }}"

    - name: Create rclone nextcloud/webdav configuration
      become: true
      become_user: "{{ rcloneui_user }}"
      shell: rclone config create nextcloud webdav vendor "nextcloud" user "{{ nextcloud_user }}" pass "{{ nextcloud_pass }}" url "{{ nextcloud_url }}"

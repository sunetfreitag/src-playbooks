---
- name: Playbook for testing and debugging
  hosts: localhost
  tasks:
    - name: Get regular user
      command: whoami
      register: regular_user

    - name: Print username
      ansible.builtin.debug:
        msg: "Username executing ansible: {{ regular_user.stdout }}"

    - name: Get hostname
      command: hostname
      register: raw_hostname

    - name: Print hostname
      ansible.builtin.debug:
        msg: "Hostname: {{ raw_hostname.stdout }}"

    - name: Save rcloneui hostname in variable
      ansible.builtin.set_fact:
        rcloneui_hostname: "{{ raw_hostname.stdout | replace('-','.') }}"

    - name: Print testing fixed Value
      ansible.builtin.debug:
        msg: "Value of testing_fixed_value: {{ testing_fixed_value }}"

    - name: Print testing secret variable
      ansible.builtin.debug:
        msg: "Value of testing_secret_var: {{ testing_secret_var }}"
